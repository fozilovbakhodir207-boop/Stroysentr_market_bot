<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroy Sentr Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 15px; color: #333; }
        h1 { text-align: center; color: #0088cc; }
        .product-card { background: white; padding: 15px; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-title { font-size: 18px; font-weight: bold; }
        .product-price { color: #27ae60; font-weight: bold; margin-top: 5px; }
        .btn { background: #0088cc; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn:active { background: #006699; }
    </style>
</head>
<body>
    <h1>Stroy Sentr Market</h1>
    <div id="product-list">
        <p style="text-align: center; color: #888;">Mahsulotlar yuklanmoqda...</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Namuna uchun mahsulotlar (Keyinchalik backenddan olinadi)
        const products = [
            { id: 0, title: "Sifatli Qalam", price: 2000, stock: 2, description: "Ustalar uchun ishlatishga qulay va sifatli qalam" }
        ];

        const listDiv = document.getElementById('product-list');
        listDiv.innerHTML = "";

        products.forEach(p => {
            let card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <div class="product-title">${p.title}</div>
                <div class="product-price">Narxi: ${p.price} so'm</div>
                <div style="font-size: 13px; color: #444;">Qoldiq: ${p.stock} dona</div>
                <div style="font-size: 14px; color: #666; margin-top: 5px;">${p.description}</div>
                <button class="btn" onclick="alert('Mahsulot tanlandi! Botdagi Savatcham bo\'limidan buyurtma bering.')">Savatga qo'shish</button>
            `;
            listDiv.appendChild(card);
        });
    </script>
</body>
</html>
