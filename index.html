<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroy Sentr Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background-color: #f4f4f9; }
        .header { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h2 { margin: 0; color: #512da8; }
        .header p { margin: 5px 0 0; color: #666; font-size: 13px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .card { background: #fff; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        .card h3 { font-size: 14px; margin: 8px 0; }
        .card p { color: #2e7d32; font-weight: bold; margin: 5px 0; }
        .btn { background: #6200ee; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; width: 100%; }
        #admin-panel { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; display: none; }
        #admin-panel input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏗 STROY SENTR</h2>
        <p>📍 Manzil: Yaypan sh., 1-maktab yonida</p>
        <p>📞 Tel: +998 (97) 105-16-56 | 💬 Tg: @DataCrafterss</p>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <h3>Admin: Yangi mahsulot qo'shish</h3>
        <input type="text" id="p-title" placeholder="Nomi">
        <input type="number" id="p-price" placeholder="Narxi">
        <input type="number" id="p-stock" placeholder="Soni/Ombor">
        <input type="text" id="p-image" placeholder="Rasm URL">
        <button class="btn" onclick="addProduct()">Qo'shish</button>
    </div>

    <!-- Mahsulotlar Ro'yxati -->
    <div id="products-grid" class="grid">
        <p style="text-align:center; width:100%;">Yuklanmoqda...</p>
    </div>

    <script>
        const API_URL = 'https://stroysentr-market-bot.onrender.com/api/products';
        const tg = window.Telegram?.WebApp;
        const ADMIN_ID = 6986848905; // Admin Telegram ID

        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Admin panelini tekshirish
  const ADMIN_ID = 6986848905;
const user_id = tg?.initDataUnsafe?.user?.id;

// Admin ID mos kelsa yoki brauzerdan kirilgan bo'lsa panelni ko'rsatish
if (String(user_id) === String(ADMIN_ID) || !user_id) {
    document.getElementById('admin-panel').style.display = 'block';
}

        let productsData = [];

        async function loadProducts() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                productsData = data.products || [];
                renderProducts();
            } catch (e) {
                console.error(e);
                document.getElementById('products-grid').innerHTML = '<p style="text-align:center; width:100%;">Mahsulotlar topilmadi yoki yuklashda xatolik.</p>';
            }
        }

        function renderProducts() {
            let grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (productsData.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">Hozircha mahsulotlar yo\'q.</p>';
                return;
            }

            productsData.forEach(p => {
                let img = p.image_url || 'https://via.placeholder.com/150';
                grid.innerHTML += `
                    <div class="card">
                        <img src="${img}" alt="${p.title}">
                        <h3>${p.title}</h3>
                        <p>${p.price} so'm</p>
                        <button class="btn">Sotib olish</button>
                    </div>
                `;
            });
        }

        async function addProduct() {
            let title = document.getElementById('p-title').value;
            let price = document.getElementById('p-price').value;
            let stock = document.getElementById('p-stock').value;
            let image_url = document.getElementById('p-image').value;

            if (!title || !price || !stock) {
                alert("Barcha maydonlarni to'ldiring!");
                return;
            }

            try {
                let res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user_id || ADMIN_ID,
                        title, price, stock, image_url
                    })
                });

                let data = await res.json();
                if (data.status === 'success') {
                    alert("Mahsulot qo'shildi!");
                    loadProducts();
                } else {
                    alert("Xatolik: " + data.message);
                }
            } catch (e) {
                alert("Xatolik yuz berdi");
            }
        }

        // Dastlabki yuklash
        loadProducts();
    </script>
</body>
</html>
